services:
  data-poller:
    build:
      context: ./app/data-poller
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: "polled-data"
      SCRAPE_INTERVAL: "10"
      POLL_INTERVAL: "60"
      DATA_DIR: /app/data
    env_file: .env
    volumes:
      - ./storage/scraper:/app/data
    profiles:
      - device_1
      - dev

  kafka:
    image: docker.io/apache/kafka:4.1.2
    restart: unless-stopped
    ports:
      - ${KAFKA_HOST_PORT:-9092}:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    env_file: .env
    volumes:
      - ./storage/kafka:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092
            --list",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 45s
    profiles:
      - device_1
      - dev

  kafka-init:
    image: docker.io/apache/kafka:4.1.2
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    network_mode: "service:kafka"
    entrypoint:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - localhost:9092
      - --create
      - --if-not-exists
      - --topic
      - polled-data
      - --partitions
      - "1"
      - --replication-factor
      - "1"
    profiles:
      - device_1
      - dev

  data-prepocess:
    build:
      context: ./app/data-prepocess
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: "polled-data"
      DATA_DIR: /app/data
      MONGO_URI: "mongodb://mongodb:27017"
      MONGO_DB: ecommerce
      MONGO_COLLECTION: reviews
      SPARK_MASTER_URL: spark://spark-master:7077
      CHECKPOINT_DIR: /app/data/checkpoint
    env_file: .env
    volumes:
      - ./storage/preprocess:/app/data
    profiles:
      - device_2
      - dev

  spark-master:
    image: docker.io/apache/spark:4.1.2
    restart: unless-stopped
    ports:
      - ${HOST_IP:-127.0.0.1}:${SPARK_APP_UI_HOST_PORT:-4040}:4040
      - ${HOST_IP:-127.0.0.1}:${SPARK_MASTER_RPC_HOST_PORT:-7077}:7077
      - ${HOST_IP:-127.0.0.1}:${SPARK_MASTER_WEB_UI_HOST_PORT:-8080}:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    profiles:
      - device_2
      - dev

  spark-worker:
    build:
      context: ./app/spark
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    profiles:
      - device_2
      - dev

  mongodb:
    image: docker.io/mongo:8.0
    restart: unless-stopped
    expose:
      - 27017
    ports:
      - ${HOST_IP:-127.0.0.1}:${MONGO_HOST_PORT:-27017}:27017
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - ./storage/mongodb:/data/db:z
    command: ["--replSet", "rs0"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    profiles:
      - device_2
      - dev

  mongodb-init:
    image: docker.io/mongo:8.0
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - mongosh
      - --host
      - mongodb
      - --eval
      - |
        try {
          rs.status();
          console.log("Replica set already initialized");
        } catch(e) {
          rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "mongodb:27017" }]
          });
          console.log("Replica set initialized");
        }
    profiles:
      - device_2
      - dev

  debezium:
    build:
      context: ./app/cdc
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_started
      mongodb-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    ports:
      - 8083:8083
    volumes:
      - ./storage/cdc/offset:/offset:z
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium-cdc-group
      CONFIG_STORAGE_TOPIC: debezium.configs
      OFFSET_STORAGE_TOPIC: debezium.offsets
      STATUS_STORAGE_TOPIC: debezium.status
      JAVA_TOOL_OPTIONS: -Xmx512m
    healthcheck:
      test: ["CMD", "curl", "-s", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    profiles:
      - device_2
      - dev

  debezium-register:
    image: docker.io/curlimages/curl:8.12.1
    restart: "no"
    depends_on:
      debezium:
        condition: service_healthy
    volumes:
      - ./scripts/register-debezium-connector.sh:/register.sh:z
    entrypoint: sh /register.sh
    profiles:
      - device_2
      - dev

  ml-inference:
    build:
      context: ./app/inference
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      postgres:
        condition: service_healthy
      debezium-register:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: cdc.mongodb.ecommerce.reviews
      KAFKA_GROUP_ID: ml-inference-group
      SPARK_MASTER_URL: spark://spark-master:7077
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${INFERENCE_DB_NAME:-postgres}
      POSTGRES_USER: ${INFERENCE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${INFERENCE_DB_PASSWORD:-postgres}
      MODEL_DIR: /app/models
      CHECKPOINT_DIR: /app/data/checkpoint
    env_file: .env
    volumes:
      - ./storage/inference:/app/data
    profiles:
      - device_3
      - dev

  postgres:
    image: docker.io/postgres:18.3-alpine3.23
    restart: unless-stopped
    volumes:
      - ./storage/postgres:/var/lib/postgresql:z
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql:z
    environment:
      POSTGRES_USER: ${INFERENCE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${INFERENCE_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${INFERENCE_DB_NAME:-postgres}
    env_file: .env
    ports:
      - ${INFERENCE_DB_HOST_PORT:-5432}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INFERENCE_DB_USER} -d ${INFERENCE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - device_3
      - dev

  streamlit:
    build:
      context: ./app/visualization
      dockerfile: Containerfile
    profiles:
      - device_4
      - dev
