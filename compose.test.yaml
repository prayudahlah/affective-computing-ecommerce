services:
  bench-poller:
    container_name: test-bench-poller
    build:
      context: ./app/bench-poller
      dockerfile: Containerfile
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      kafka-init-cdc:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      debezium-register:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: "polled-data"
      KAFKA_CDC_TOPIC: "cdc.mongodb.ecommerce.reviews"
      MONGO_URI: "mongodb://mongodb:27017"
      MONGO_DB: ecommerce
      MONGO_COLLECTION: reviews
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      BENCH_MESSAGE_COUNT: "100"
      BENCH_TIMEOUT_SEC: "600"
      BENCH_OUTPUT_PATH: /app/data/benchmark_result.json
      PRODUCE_INTERVAL: "0.5"
      PRODUCE_PROBABILITY: "0.7"
      BENCH_STARTUP_DELAY_SEC: "60"
    tmpfs:
      - /app/data

  kafka:
    container_name: test-kafka
    image: docker.io/apache/kafka:4.1.2
    restart: "no"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_LOG_DIRS: /tmp/kafka/data
    tmpfs:
      - /tmp/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092
            --list",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  kafka-init:
    container_name: test-kafka-init
    image: docker.io/apache/kafka:4.1.2
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    network_mode: "service:kafka"
    entrypoint:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - localhost:9092
      - --create
      - --if-not-exists
      - --topic
      - polled-data
      - --partitions
      - "1"
      - --replication-factor
      - "1"

  kafka-init-cdc:
    container_name: test-kafka-init-cdc
    image: docker.io/apache/kafka:4.1.2
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    network_mode: "service:kafka"
    entrypoint:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - localhost:9092
      - --create
      - --if-not-exists
      - --topic
      - cdc.mongodb.ecommerce.reviews
      - --partitions
      - "1"
      - --replication-factor
      - "1"

  mongodb:
    container_name: test-mongodb
    image: docker.io/mongo:8.0
    restart: "no"
    command: ["--replSet", "rs0"]
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  mongodb-init:
    container_name: test-mongodb-init
    image: docker.io/mongo:8.0
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - mongosh
      - --host
      - mongodb
      - --eval
      - |
        try {
          rs.status();
          console.log("Replica set already initialized");
        } catch(e) {
          rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "mongodb:27017" }]
          });
          console.log("Replica set initialized");
        }

  debezium:
    container_name: test-debezium
    build:
      context: ./app/cdc
      dockerfile: Containerfile
    restart: "no"
    depends_on:
      mongodb:
        condition: service_started
      mongodb-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium-cdc-group-test
      CONFIG_STORAGE_TOPIC: debezium.configs.test
      OFFSET_STORAGE_TOPIC: debezium.offsets.test
      STATUS_STORAGE_TOPIC: debezium.status.test
      JAVA_TOOL_OPTIONS: -Xmx512m
    tmpfs:
      - /offset
    healthcheck:
      test: ["CMD", "curl", "-s", "-f", "http://localhost:8083/connectors"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  debezium-register:
    container_name: test-debezium-register
    image: docker.io/curlimages/curl:8.12.1
    restart: "no"
    depends_on:
      debezium:
        condition: service_healthy
    volumes:
      - ./scripts/register-debezium-connector.sh:/register.sh:z
    entrypoint: sh /register.sh debezium 8083

  data-preprocess:
    container_name: test-data-preprocess
    build:
      context: ./app/data-preprocess
      dockerfile: Containerfile
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: "polled-data"
      MONGO_URI: "mongodb://mongodb:27017"
      MONGO_DB: ecommerce
      MONGO_COLLECTION: reviews
      SPARK_MASTER_URL: "local[*]"
      SPARK_TRIGGER_INTERVAL: "1 second"
      CHECKPOINT_DIR: /tmp/checkpoint
    tmpfs:
      - /tmp/checkpoint

  postgres:
    container_name: test-postgres
    build:
      context: ./app/postgres
      dockerfile: Containerfile
    restart: "no"
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql:z
      - ./scripts/init-telegram-config.sh:/docker-entrypoint-initdb.d/init-telegram-config.sh:z
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      TELEGRAM_BOT_TOKEN: dummy
      TELEGRAM_CHAT_ID: dummy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  ml-inference:
    container_name: test-ml-inference
    build:
      context: ./app/inference
      dockerfile: Containerfile
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init-cdc:
        condition: service_completed_successfully
      debezium-register:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: "cdc.mongodb.ecommerce.reviews"
      KAFKA_GROUP_ID: ml-inference-group-test
      SPARK_MASTER_URL: "local[*]"
      SPARK_TRIGGER_INTERVAL: "1 second"
      POSTGRES_JDBC_URL: "jdbc:postgresql://postgres:5432/postgres"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      INFERENCE_DB_HOST: postgres
      MODEL_DIR: /app/models
      CHECKPOINT_DIR: /tmp/checkpoint
    tmpfs:
      - /tmp/checkpoint
