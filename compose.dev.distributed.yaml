services:
  data-poller:
    build:
      context: ./app/data-poller
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      - kafka
    network_mode: host
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${DEVICE_1_IP:-127.0.0.1}:9092
      KAFKA_TOPIC: polled-data
      KAFKA_GROUP_ID: polled-data-group
    env_file: .env
    profiles:
      - device_1
      - dev

  kafka:
    image: docker.io/apache/kafka:4.1.2
    restart: unless-stopped
    network_mode: host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://${DEVICE_1_IP:-127.0.0.1}:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${DEVICE_1_IP:-127.0.0.1}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    env_file: .env
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092
            --list",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 45s
    profiles:
      - device_1
      - dev

  kafka-init:
    image: docker.io/apache/kafka:4.1.2
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    network_mode: host
    entrypoint:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - ${DEVICE_1_IP:-127.0.0.1}:9092
      - --create
      - --if-not-exists
      - --topic
      - polled-data
      - --partitions
      - "1"
      - --replication-factor
      - "1"
    env_file: .env
    profiles:
      - device_1
      - dev

  kafka-init-cdc:
    image: docker.io/apache/kafka:4.1.2
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    network_mode: host
    entrypoint:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - ${DEVICE_1_IP:-127.0.0.1}:9092
      - --create
      - --if-not-exists
      - --topic
      - cdc.mongodb.ecommerce.reviews
      - --partitions
      - "1"
      - --replication-factor
      - "1"
    env_file: .env
    profiles:
      - device_1
      - dev

  kafka-ui:
    image: docker.io/provectuslabs/kafka-ui:latest
    restart: unless-stopped
    network_mode: host
    environment:
      SERVER_PORT: 8082
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${DEVICE_1_IP:-127.0.0.1}:9092
    profiles:
      - device_1
      - dev

  data-preprocess:
    build:
      context: ./app/data-preprocess
      dockerfile: Containerfile
    restart: unless-stopped
    network_mode: host
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${DEVICE_1_IP:-127.0.0.1}:9092
      KAFKA_TOPIC: "polled-data"
      SCRAPE_INTERVAL: "10"
      POLL_INTERVAL: "60"
      DATA_DIR: /app/data
      MONGO_URI: "mongodb://localhost:27017"
      MONGO_DB: ecommerce
      MONGO_COLLECTION: reviews
      SPARK_MASTER_URL: spark://${DEVICE_2_IP:-127.0.0.1}:7077
      CHECKPOINT_DIR: /app/data/checkpoint
    env_file: .env
    volumes:
      - preprocess-data:/app/data
    profiles:
      - device_2
      - dev

  spark-master:
    image: docker.io/apache/spark:4.1.2
    restart: unless-stopped
    network_mode: host
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host 127.0.0.1
    env_file: .env
    profiles:
      - device_2
      - dev

  spark-worker:
    build:
      context: ./app/spark
      dockerfile: Containerfile
    restart: unless-stopped
    network_mode: host
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://127.0.0.1:7077
    env_file: .env
    profiles:
      - device_2
      - dev

  mongodb:
    image: docker.io/mongo:8.0
    restart: unless-stopped
    network_mode: host
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - mongodb-data:/data/db
    command: ["--replSet", "rs0"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    profiles:
      - device_2
      - dev

  mongodb-init:
    image: docker.io/mongo:8.0
    restart: "no"
    network_mode: host
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - mongosh
      - --host
      - localhost
      - --eval
      - |
        try {
          rs.status();
          console.log("Replica set already initialized");
        } catch(e) {
          rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "localhost:27017" }]
          });
          console.log("Replica set initialized");
        }
    profiles:
      - device_2
      - dev

  mongo-express:
    image: docker.io/mongo-express:1.0.2-20
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: 8084
      ME_CONFIG_MONGODB_URL: mongodb://localhost:27017/${MONGO_DB:-ecommerce}?replicaSet=rs0
      ME_CONFIG_BASICAUTH: "false"
    profiles:
      - device_2
      - dev

  debezium:
    build:
      context: ./app/cdc
      dockerfile: Containerfile
    restart: unless-stopped
    network_mode: host
    depends_on:
      mongodb:
        condition: service_started
      mongodb-init:
        condition: service_completed_successfully
    volumes:
      - cdc-offset-data:/offset
    environment:
      BOOTSTRAP_SERVERS: ${DEVICE_1_IP:-127.0.0.1}:9092
      GROUP_ID: debezium-cdc-group
      CONFIG_STORAGE_TOPIC: debezium.configs
      OFFSET_STORAGE_TOPIC: debezium.offsets
      STATUS_STORAGE_TOPIC: debezium.status
      JAVA_TOOL_OPTIONS: -Xmx512m
    healthcheck:
      test: ["CMD", "curl", "-s", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    profiles:
      - device_2
      - dev

  debezium-register:
    image: docker.io/curlimages/curl:8.12.1
    restart: "no"
    network_mode: host
    depends_on:
      debezium:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://localhost:27017/?replicaSet=rs0
    volumes:
      - ./scripts/register-debezium-connector.sh:/register.sh:z
    entrypoint: sh /register.sh localhost 8083
    profiles:
      - device_2
      - dev

  ml-inference:
    build:
      context: ./app/inference
      dockerfile: Containerfile
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${DEVICE_1_IP:-127.0.0.1}:9092
      KAFKA_TOPIC: cdc.mongodb.ecommerce.reviews
      KAFKA_GROUP_ID: ml-inference-group
      SPARK_MASTER_URL: spark://${DEVICE_2_IP:-127.0.0.1}:7077
      POSTGRES_JDBC_URL: jdbc:postgresql://localhost:${INFERENCE_DB_HOST_PORT:-5432}/${INFERENCE_DB_NAME:-postgres}
      POSTGRES_USER: ${INFERENCE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${INFERENCE_DB_PASSWORD:-postgres}
      MODEL_DIR: /app/models
      CHECKPOINT_DIR: /app/data/checkpoint
    env_file: .env
    volumes:
      - inference-data:/app/data
    profiles:
      - device_3
      - dev

  postgres:
    build:
      context: ./app/postgres
      dockerfile: Containerfile
    restart: unless-stopped
    network_mode: host
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql:z
      - ./scripts/init-telegram-config.sh:/docker-entrypoint-initdb.d/init-telegram-config.sh:z
    environment:
      POSTGRES_USER: ${INFERENCE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${INFERENCE_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${INFERENCE_DB_NAME:-postgres}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INFERENCE_DB_USER} -d ${INFERENCE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - device_3
      - dev

  streamlit:
    build:
      context: ./app/visualization
      dockerfile: Containerfile
    network_mode: host
    environment:
      INFERENCE_DB_HOST: ${DEVICE_3_IP:-127.0.0.1}
      INFERENCE_DB_USER: ${INFERENCE_DB_USER:-postgres}
      INFERENCE_DB_PASSWORD: ${INFERENCE_DB_PASSWORD:-postgres}
      INFERENCE_DB_NAME: ${INFERENCE_DB_NAME:-postgres}
    profiles:
      - device_4
      - dev

volumes:
  kafka-data:
  mongodb-data:
  postgres-data:
  cdc-offset-data:
  preprocess-data:
  inference-data:
