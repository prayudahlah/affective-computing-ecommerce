services:
  data-poller:
    build:
      context: ./app/data-poller
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      - kafka
    network_mode: host
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_HOST_IP:-127.0.0.1}:9092
      KAFKA_TOPIC: polled-data
      KAFKA_GROUP_ID: polled-data-group
    env_file: .env
    profiles:
      - device_1
      - dev

  kafka:
    image: docker.io/apache/kafka:4.1.2
    restart: unless-stopped
    ports:
      - ${KAFKA_HOST_PORT:-9092}:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    profiles:
      - device_1
      - dev

  spark-master:
    image: docker.io/apache/spark:4.1.1
    restart: unless-stopped
    ports:
      - ${HOST_IP:-127.0.0.1}:${SPARK_APP_UI_HOST_PORT:-4040}:4040
      - ${HOST_IP:-127.0.0.1}:${SPARK_MASTER_RPC_HOST_PORT:-7077}:7077
      - ${HOST_IP:-127.0.0.1}:${SPARK_MASTER_WEB_UI_HOST_PORT:-8080}:8080
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    profiles:
      - device_2
      - dev

  spark-worker:
    image: docker.io/apache/spark:4.1.1
    restart: unless-stopped
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    profiles:
      - device_2
      - dev

  mongodb:
    image: docker.io/mongodb/mongodb-community-server:8.0-ubuntu2204
    restart: unless-stopped
    expose:
      - 27017
    ports:
      - ${HOST_IP:-127.0.0.1}:${MONGO_HOST_PORT:-27017}:27017
    volumes:
      - ./storage/mongodb:/data/db:z
    command: ["--replSet", "rs0"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    profiles:
      - device_2
      - dev

  debezium:
    build:
      context: ./app/cdc
      dockerfile: Containerfile
    restart: unless-stopped
    network_mode: host
    depends_on:
      - mongodb
      - kafka
    volumes:
      - ./storage/cdc/offset:/offset:z
    environment:
      BOOTSTRAP_SERVERS: ${KAFKA_HOST_IP:-127.0.0.1}:${KAFKA_HOST_PORT:-9092}
      GROUP_ID: debezium-cdc-group
      CONFIG_STORAGE_TOPIC: debezium.configs
      OFFSET_STORAGE_TOPIC: debezium.offsets
      STATUS_STORAGE_TOPIC: debezium.status
      JAVA_TOOL_OPTIONS: -Xmx512m
    profiles:
      - device_2
      - dev

  ml-inference:
    build:
      context: ./app/inference
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      - kafka
    network_mode: host
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_HOST_IP:-127.0.0.1}:${KAFKA_HOST_PORT:-9092}
      KAFKA_TOPIC: cdc.mongodb.ecommerce.reviews
      KAFKA_GROUP_ID: ml-inference-group
    env_file: .env
    profiles:
      - device_3
      - dev

  postgres:
    image: docker.io/postgres:18.3-alpine3.23
    restart: unless-stopped
    volumes:
      - ./storage/postgres:/var/lib/postgresql:z
    environment:
      POSTGRES_USER: ${INFERENCE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${INFERENCE_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${INFERENCE_DB_NAME:-postgres}
    env_file: .env
    ports:
      - ${INFERENCE_DB_HOST_PORT:-5432}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INFERENCE_DB_USER} -d ${INFERENCE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - device_3
      - dev

  streamlit:
    build:
      context: ./app/visualization
      dockerfile: Containerfile
    network_mode: host
    profiles:
      - device_4
      - dev
