services:
  data-poller:
    build:
      context: ./app/data-poller
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      - kafka
    network_mode: host
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_HOST_IP:-127.0.0.1}:9092
      KAFKA_TOPIC: polled-data
      KAFKA_GROUP_ID: polled-data-group
    env_file: .env

  kafka:
    image: docker.io/apache/kafka:4.1.2
    restart: unless-stopped
    ports:
      - ${KAFKA_HOST_PORT:-9092}:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  spark-master:
    image: docker.io/apache/spark:4.1.1
    restart: unless-stopped
    ports:
      - ${HOST_IP:-127.0.0.1}:${SPARK_APP_UI_HOST_PORT:-4040}:4040
      - ${HOST_IP:-127.0.0.1}:${SPARK_MASTER_RPC_HOST_PORT:-7077}:7077
      - ${HOST_IP:-127.0.0.1}:${SPARK_MASTER_WEB_UI_HOST_PORT:-8080}:8080
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  spark-worker:
    image: docker.io/apache/spark:4.1.1
    restart: unless-stopped
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077

  cassandra:
    image: docker.io/cassandra:5.0.8
    entrypoint: ["cassandra", "-f", "-R"]
    restart: unless-stopped
    expose:
      - 9042
    ports:
      - ${HOST_IP:-127.0.0.1}:${CASSANDRA_HOST_PORT:-9042}:9042
    volumes:
      - ./app/cdc/config/cassandra.yaml:/etc/cassandra/cassandra.yaml:z
      - ./storage/cassandra:/var/lib/cassandra:z
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -E '^UN\\s'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  debezium:
    build:
      context: ./app/cdc
      dockerfile: Containerfile
    restart: unless-stopped
    network_mode: host
    depends_on:
      - cassandra
      - kafka
    volumes:
      - ./app/cdc/config/config.properties:/config/config.properties:ro
      - ./app/cdc/config/cassandra.yaml:/config/cassandra.yaml:ro
      - ./storage/cassandra/cdc_raw:/cdc_raw:ro
      - ./storage/cdc/offset:/offset:z
      - ./storage/cdc/relocation:/relocation:z
    environment:
      JAVA_TOOL_OPTIONS: -Xmx512m
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_HOST_IP:-127.0.0.1}:${KAFKA_HOST_PORT:-9092}

  ml-inference:
    build:
      context: ./app/inference
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      - kafka
    network_mode: host
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_HOST_IP:-127.0.0.1}:${KAFKA_HOST_PORT:-9092}
      KAFKA_TOPIC: cdc.cassandra.ecommerce.reviews
      KAFKA_GROUP_ID: ml-inference-group
    env_file: .env

  postgres:
    image: docker.io/postgres:18.3-alpine3.23
    restart: unless-stopped
    volumes:
      - ./storage/postgres:/var/lib/postgresql:z
    environment:
      POSTGRES_USER: ${INFERENCE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${INFERENCE_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${INFERENCE_DB_NAME:-postgres}
    env_file: .env
    ports:
      - ${INFERENCE_DB_HOST_PORT:-5432}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INFERENCE_DB_USER} -d ${INFERENCE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  streamlit:
    build:
      context: ./app/visualization
      dockerfile: Containerfile
    network_mode: host

  scraper:
    build:
      context: ./app/scraper
      dockerfile: Containerfile
    network_mode: host
    restart: "no"
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
      KAFKA_TOPIC: polled-data
    env_file: .env
    volumes:
      - ./storage/scraper:/app/data
